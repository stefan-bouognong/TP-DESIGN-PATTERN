<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Demande d'immatriculation</title>
    <style>
        body { font-family: Arial; font-size: 14px; }
        h1 { text-align: center; }
        .box { border: 1px solid #000; padding: 15px; margin-top: 15px; }
    </style>
</head>
<body>

<h1>DEMANDE D’IMMATRICULATION</h1>

<div class="box">
    <p><strong>Nom du demandeur :</strong> <span th:text="${data.clientName}"></span></p>
    <p><strong>Adresse :</strong> <span th:text="${data.shippingAddress}"></span></p>
</div>

<div class="box">
    <p><strong>Commande N° :</strong> <span th:text="${data.orderId}"></span></p>
    <p><strong>Date :</strong> <span th:text="${#temporals.format(data.orderDate,'dd/MM/yyyy')}"></span></p>
</div>

<div class="box">
    <p>
        Je soussigné(e), <strong th:text="${data.clientName}"></strong>,
        sollicite l’immatriculation du véhicule acquis auprès de DriveDeal.
    </p>
</div>

<br><br>

<p>Fait le : <span th:text="${#temporals.format(data.generatedAt,'dd/MM/yyyy')}"></span></p>

<p>Signature du demandeur :</p>
<br><br>
<p>____________________________</p>

</body>
</html>
